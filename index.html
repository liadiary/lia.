<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>Flourish — Review Hub</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="app-shell">
<aside class="sidebar"><a class="brand" href="#"><span>F</span><b>Flourish</b></a>
<nav><small>工作区</small><a class="active" href="#reviews">▣ 审阅项目 <i id="navCount">0</i></a><a href="#overview">⌁ 数据概览</a></nav>
<nav class="status-nav"><small>项目状态</small><button data-filter="pending"><i class="dot"></i>等待反馈</button><button data-filter="progress"><i class="dot mid"></i>进行中</button><button data-filter="done"><i class="dot ring"></i>已完成</button></nav>
<div class="profile"><span>FH</span><div><b>Flourish 团队</b><small>本地工作区</small></div><i>•••</i></div></aside>
<section class="main-panel"><header class="topbar"><button id="mobileMenu" class="icon mobile" aria-label="打开菜单">☰</button><div class="crumb"><span>Flourish</span> / <b>审阅中心</b></div><div class="actions"><button id="themeToggle" class="icon" aria-label="切换主题">◐</button><button id="newReviewButton" class="primary">＋ 新建审阅</button></div></header>
<main class="content"><section class="intro" id="overview"><div><small>审阅工作区</small><h1>好的决定，<br>由我们<em>共同完成。</em></h1><p>集中管理反馈与决策，让每一次审阅都更清晰、更高效。</p></div><div class="today"><div><span id="todayWeekday"></span><b id="todayDate"></b></div><p><strong id="todayPending">0</strong> 个活跃审阅</p></div></section>
<section class="metrics"><article><span>全部审阅</span><b id="totalCount">0</b><small>当前工作区</small></article><article><span>等待反馈</span><b id="pendingCount">0</b><small>需要关注</small></article><article><span>进行中</span><b id="progressCount">0</b><small>持续推进</small></article><article><span>已完成</span><b id="doneCount">0</b><small>准备交付</small></article></section>
<section class="reviews" id="reviews"><div class="section-head"><div><h2>审阅项目</h2><span>管理所有审阅事项</span></div><label class="search">⌕<input id="searchInput" type="search" placeholder="搜索审阅项目…"><kbd>⌘ K</kbd></label></div>
<div class="toolbar"><div id="filters"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="pending">等待反馈</button><button class="filter" data-filter="progress">进行中</button><button class="filter" data-filter="done">已完成</button></div><span class="saved"><i></i> 已保存至本地</span></div>
<div class="table-head"><span>审阅项目</span><span>状态</span><span>负责人</span><span>截止日期</span><span></span></div><div id="reviewGrid" class="review-grid"></div>
<div id="emptyState" class="empty" hidden><div>◇</div><h3>没有找到审阅项目</h3><p>调整筛选条件，或创建一条新的审阅。</p><button id="emptyCreate" class="primary">＋ 新建审阅</button></div></section></main></section></div>
<dialog id="reviewDialog"><form id="reviewForm" method="dialog"><header><div><small>审阅详情</small><h2 id="dialogTitle">新建审阅</h2></div><button id="closeDialog" class="close" type="button" aria-label="关闭">×</button></header><input id="reviewId" type="hidden"><label>标题<input id="titleInput" required maxlength="60" placeholder="需要审阅什么？"></label><div class="form-row"><label>负责人<input id="ownerInput" required maxlength="30" placeholder="姓名或团队"></label><label>截止日期<input id="dateInput" required type="date"></label></div><div class="form-row"><label>状态<select id="statusInput"><option value="pending">等待反馈</option><option value="progress">进行中</option><option value="done">已完成</option></select></label><label>分类<input id="tagInput" maxlength="20" placeholder="设计、产品、内容…"></label></div><label>说明<textarea id="descriptionInput" rows="4" maxlength="240" placeholder="补充背景、目标或反馈重点…"></textarea></label><footer><button id="deleteButton" class="danger" type="button" hidden>删除</button><span></span><button id="cancelButton" class="secondary" type="button">取消</button><button class="primary" type="submit">保存审阅</button></footer></form></dialog><div id="toast" class="toast"></div><script src="app.js"></script></body></html>
